<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans JP', 'Meiryo', sans-serif;
      font-size: 13px;
      margin: 8px;
      color: #333;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #1a73e8;
    }
    select {
      width: 100%;
      padding: 4px 6px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    #status {
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: #1a73e8;
      color: #fff;
      padding: 4px 6px;
      text-align: left;
      font-size: 12px;
    }
    tbody tr {
      cursor: pointer;
    }
    tbody tr:nth-child(even) {
      background: #f5f5f5;
    }
    tbody tr:hover {
      background: #e8f0fe;
    }
    tbody td {
      padding: 4px 6px;
      border-bottom: 1px solid #e0e0e0;
    }
    .td-key {
      font-weight: bold;
      width: 55%;
    }
    .td-val {
      text-align: right;
      width: 45%;
    }
    #hint {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <h3>🎲 キャラクターパレット</h3>

  <select id="characterSelect">
    <option value="">キャラクターを選択...</option>
  </select>

  <div id="status">読み込み中...</div>

  <table id="skillTable" style="display:none;">
    <thead>
      <tr>
        <th class="td-key">技能・属性</th>
        <th class="td-val">値</th>
      </tr>
    </thead>
    <tbody id="skillBody"></tbody>
  </table>

  <div id="hint" style="display:none;">
    ダブルクリックでアクティブセルにロールコマンドを入力
  </div>

  <script>
    // 起動時にキャラクターリストを取得
    google.script.run
      .withSuccessHandler(populateCharacterList)
      .withFailureHandler(function(err) {
        document.getElementById('status').textContent = 'エラー: ' + err.message;
      })
      .getCharacterList();

    function populateCharacterList(characters) {
      var select = document.getElementById('characterSelect');
      if (!characters || characters.length === 0) {
        document.getElementById('status').textContent = 'キャラクターが見つかりません。';
        return;
      }
      characters.forEach(function(ch) {
        var opt = document.createElement('option');
        opt.value = ch.no;
        opt.textContent = ch.no + ': ' + ch.name;
        select.appendChild(opt);
      });
      document.getElementById('status').textContent = '';
    }

    document.getElementById('characterSelect').addEventListener('change', function() {
      var paletteNo = this.value;
      if (paletteNo === '') {
        document.getElementById('skillTable').style.display = 'none';
        document.getElementById('hint').style.display = 'none';
        document.getElementById('status').textContent = '';
        return;
      }
      document.getElementById('status').textContent = '読み込み中...';
      document.getElementById('skillTable').style.display = 'none';
      document.getElementById('hint').style.display = 'none';
      google.script.run
        .withSuccessHandler(populateSkillTable)
        .withFailureHandler(function(err) {
          document.getElementById('status').textContent = 'エラー: ' + err.message;
        })
        .getCharacterSkills(Number(paletteNo));
    });

    function populateSkillTable(skills) {
      var tbody = document.getElementById('skillBody');
      tbody.innerHTML = '';

      if (!skills || skills.length === 0) {
        document.getElementById('status').textContent = '技能データがありません。';
        return;
      }

      skills.forEach(function(skill) {
        var tr = document.createElement('tr');
        var tdKey = document.createElement('td');
        tdKey.className = 'td-key';
        tdKey.textContent = skill.key;
        var tdVal = document.createElement('td');
        tdVal.className = 'td-val';
        tdVal.textContent = skill.value;
        tr.appendChild(tdKey);
        tr.appendChild(tdVal);

        tr.addEventListener('dblclick', function() {
          insertRollCommand(skill.key, skill.value);
        });

        tbody.appendChild(tr);
      });

      document.getElementById('status').textContent = '';
      document.getElementById('skillTable').style.display = 'table';
      document.getElementById('hint').style.display = 'block';
    }

    function insertRollCommand(key, value) {
      var command = '/' + key;
      google.script.run
        .withSuccessHandler(function() {
          // コマンド挿入成功 - 視覚フィードバック
          document.getElementById('status').textContent = '「' + command + '」を入力しました。';
          setTimeout(function() {
            document.getElementById('status').textContent = '';
          }, 2000);
        })
        .withFailureHandler(function(err) {
          document.getElementById('status').textContent = 'エラー: ' + err.message;
        })
        .insertRollCommandToActiveCell(command);
    }
  </script>
</body>
</html>
