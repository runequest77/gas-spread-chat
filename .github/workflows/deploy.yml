name: Deploy to GAS

on:
  workflow_dispatch:
    inputs:
      script_id:
        description: 'Update Target Script ID'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json (Login)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          let credentials;
          const secretText = process.env.CLASPRC_JSON ?? '';
          const normalizedSecretText = secretText.replace(/^\uFEFF/, '').trim();
          let credentialsText = normalizedSecretText;

          if (normalizedSecretText === '') {
            console.error('::error::GitHub Actions received an empty value for secrets.CLASPRC_JSON.');
            console.error('::error::This usually means the workflow could not access a non-empty secret with that exact name. Check the repository or environment secret scope, spelling, and whether the run context is allowed to read secrets.');
            console.error('::notice::If the secret content were malformed JSON or had an encoding issue, this step would continue and fail later with a JSON parsing error instead of this empty-value error.');
            process.exit(1);
          }

          try {
            credentials = JSON.parse(credentialsText);
          } catch (error) {
            try {
              credentialsText = Buffer.from(normalizedSecretText, 'base64').toString('utf8').replace(/^\uFEFF/, '').trim();
              credentials = JSON.parse(credentialsText);
            } catch {
              console.error('::error::CLASPRC_JSON must contain valid JSON syntax for your clasp credentials.');
              console.error('::notice::Store either the raw contents of ~/.clasprc.json or a base64-encoded copy of that JSON.');
              console.error(error.message);
              process.exit(1);
            }
          }

          if (credentials === null) {
            console.error('::error::CLASPRC_JSON decoded to null; expected a JSON object for your clasp credentials.');
            process.exit(1);
          }

          if (Array.isArray(credentials)) {
            console.error('::error::CLASPRC_JSON decoded to an array; expected a JSON object for your clasp credentials.');
            process.exit(1);
          }

          if (typeof credentials !== 'object') {
            console.error('::error::CLASPRC_JSON decoded to a non-object value; expected a JSON object for your clasp credentials.');
            process.exit(1);
          }

          try {
            fs.writeFileSync(`${os.homedir()}/.clasprc.json`, `${JSON.stringify(credentials, null, 2)}\n`);
          } catch (error) {
            console.error('::error::Failed to write ~/.clasprc.json from CLASPRC_JSON.');
            console.error(error.message);
            process.exit(1);
          }
          NODE

      - name: Generate config and Push (Target & Deploy)
        env:
          SCRIPT_ID: ${{ github.event.inputs.script_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          try {
            if (!process.env.SCRIPT_ID || process.env.SCRIPT_ID.trim() === '') {
              throw new Error('A non-empty script_id input is required.');
            }

            fs.writeFileSync('.clasp.json', JSON.stringify({
              scriptId: process.env.SCRIPT_ID,
              rootDir: '.',
            }, null, 2));
          } catch (error) {
            console.error('::error::Failed to generate a valid .clasp.json deployment config.');
            console.error(error.message);
            process.exit(1);
          }
          NODE
          clasp push -f
