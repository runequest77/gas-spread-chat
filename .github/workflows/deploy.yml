name: Deploy to GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tracked deployment target
        id: target
        shell: bash
        run: |
          if [[ ! -f .clasp.json ]] || ! git ls-files --error-unmatch .clasp.json >/dev/null 2>&1; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.clasp.json is not tracked yet; skipping GAS deployment."
            exit 0
          fi

          node - <<'NODE'
          const fs = require('node:fs');

          try {
            const config = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));
            if (typeof config.scriptId !== 'string' || config.scriptId.trim() === '') {
              throw new Error('.clasp.json must contain a non-empty scriptId.');
            }
          } catch (error) {
            console.error('::error::Invalid tracked .clasp.json deployment config.');
            console.error(error.message);
            process.exit(1);
          }
          NODE

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.target.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.target.outputs.enabled == 'true'
        run: npm install -g @google/clasp

      - name: Create clasprc.json (Login)
        if: steps.target.outputs.enabled == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const normalizeText = (value) => value.replace(/^\uFEFF/, '').trim();
          let credentials;
          const secretText = process.env.CLASPRC_JSON ?? '';
          const normalizedSecretText = normalizeText(secretText);
          let credentialsText = normalizedSecretText;

          if (normalizedSecretText === '') {
            console.error('::error::GitHub Actions received an empty value for secrets.CLASPRC_JSON.');
            console.error('::error::Check the repository secret scope, spelling, and whether the run context is allowed to read secrets.');
            process.exit(1);
          }

          try {
            credentials = JSON.parse(credentialsText);
          } catch (error) {
            try {
              credentialsText = normalizeText(Buffer.from(normalizedSecretText, 'base64').toString('utf8'));
              credentials = JSON.parse(credentialsText);
            } catch {
              console.error('::error::CLASPRC_JSON must contain valid JSON syntax for your clasp credentials.');
              console.error('::notice::Store either the raw contents of ~/.clasprc.json or a base64-encoded copy of that JSON.');
              console.error(error.message);
              process.exit(1);
            }
          }

          if (credentials === null || Array.isArray(credentials) || typeof credentials !== 'object') {
            console.error('::error::CLASPRC_JSON must decode to a JSON object.');
            process.exit(1);
          }

          try {
            fs.writeFileSync(`${os.homedir()}/.clasprc.json`, `${JSON.stringify(credentials, null, 2)}\n`);
          } catch (error) {
            console.error('::error::Failed to write ~/.clasprc.json from CLASPRC_JSON.');
            console.error(error.message);
            process.exit(1);
          }
          NODE

      - name: Push to tracked GAS target
        if: steps.target.outputs.enabled == 'true'
        run: clasp push -f
