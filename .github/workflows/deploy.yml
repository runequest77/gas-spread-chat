name: Deploy to GAS

on:
  workflow_dispatch:
    inputs:
      script_id:
        description: 'Update Target Script ID'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json (Login)
        # 最も安全な書き込み方法に変更
        run: |
          cat << 'EOF' > ~/.clasprc.json
          ${{ secrets.CLASPRC_JSON }}
          EOF

      - name: Generate config and Push (Target & Deploy)
        run: |
          cat << 'EOF' > .clasp.json
          {"scriptId":"${{ github.event.inputs.script_id }}","rootDir":"."}
          EOF
          clasp push -f
