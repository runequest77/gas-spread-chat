name: Deploy to GAS

on:
  workflow_dispatch:
    inputs:
      script_id:
        description: 'Update Target Script ID'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json (Login)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing CLASPRC_JSON secret. Add valid clasp credentials JSON to the repository secrets before deploying."
            exit 1
          fi

          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          node - <<'NODE'
          try {
            const credentials = JSON.parse(require('node:fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'));

            if (!credentials || typeof credentials !== 'object' || Array.isArray(credentials)) {
              throw new Error('CLASPRC_JSON must decode to a JSON object.');
            }
          } catch (error) {
            console.error('::error::CLASPRC_JSON must contain valid JSON for your clasp credentials.');
            console.error(error.message);
            process.exit(1);
          }
          NODE

      - name: Generate config and Push (Target & Deploy)
        env:
          SCRIPT_ID: ${{ github.event.inputs.script_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          try {
            const config = {
              scriptId: process.env.SCRIPT_ID,
              rootDir: '.',
            };

            fs.writeFileSync('.clasp.json', JSON.stringify(config));

            const parsed = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'));

            if (!parsed.scriptId || parsed.rootDir !== '.') {
              throw new Error('.clasp.json must include scriptId and rootDir.');
            }
          } catch (error) {
            console.error('::error::Failed to generate a valid .clasp.json deployment config with scriptId and rootDir.');
            console.error(error.message);
            process.exit(1);
          }
          NODE
          clasp push -f
