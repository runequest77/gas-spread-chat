name: Deploy to GAS

on:
  workflow_dispatch:
    inputs:
      script_id:
        description: 'Update Target Script ID'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json (Login)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing CLASPRC_JSON secret. Add valid clasp credentials JSON to the repository secrets before deploying."
            exit 1
          fi

          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          node - <<'NODE'
          const fs = require('node:fs');
          let credentials;
          let credentialsText;

          try {
            credentialsText = fs.readFileSync(process.env.HOME + '/.clasprc.json', 'utf8');
          } catch (error) {
            console.error('::error::Failed to read ~/.clasprc.json after writing CLASPRC_JSON.');
            console.error(error.message);
            process.exit(1);
          }

          try {
            credentials = JSON.parse(credentialsText);
          } catch (error) {
            console.error('::error::CLASPRC_JSON must contain valid JSON syntax for your clasp credentials.');
            console.error(error.message);
            process.exit(1);
          }

          if (credentials === null) {
            console.error('::error::CLASPRC_JSON decoded to null; expected a JSON object for your clasp credentials.');
            process.exit(1);
          }

          if (Array.isArray(credentials)) {
            console.error('::error::CLASPRC_JSON decoded to an array; expected a JSON object for your clasp credentials.');
            process.exit(1);
          }

          if (typeof credentials !== 'object') {
            console.error('::error::CLASPRC_JSON decoded to a non-object value; expected a JSON object for your clasp credentials.');
            process.exit(1);
          }
          NODE

      - name: Generate config and Push (Target & Deploy)
        env:
          SCRIPT_ID: ${{ github.event.inputs.script_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          try {
            if (!process.env.SCRIPT_ID || process.env.SCRIPT_ID.trim() === '') {
              throw new Error('A non-empty script_id input is required.');
            }

            fs.writeFileSync('.clasp.json', JSON.stringify({
              scriptId: process.env.SCRIPT_ID,
              rootDir: '.',
            }, null, 2));
          } catch (error) {
            console.error('::error::Failed to generate a valid .clasp.json deployment config.');
            console.error(error.message);
            process.exit(1);
          }
          NODE
          clasp push -f
